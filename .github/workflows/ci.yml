name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.ps1'
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '*.ps1'
      - '**.md'
permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    name: Test and Analyze Code

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install required PowerShell modules
      shell: pwsh
      run: |
        Install-Module -Name Pester -Force -SkipPublisherCheck
        Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck

    - name: Run PSScriptAnalyzer
      shell: pwsh
      run: |
        $analysisResults = Invoke-ScriptAnalyzer -Path . -Settings PSScriptAnalyzerSettings.psd1 -Recurse
        if ($analysisResults) {
          $analysisResults | ForEach-Object {
            Write-Host "::$($_.Severity.ToString().ToLower())::$($_.ScriptName):$($_.Line):$($_.Column): $($_.Message) ($($_.RuleName))"
          }
          $errorCount = ($analysisResults | Where-Object Severity -eq 'Error').Count
          $warningCount = ($analysisResults | Where-Object Severity -eq 'Warning').Count
          Write-Host "PSScriptAnalyzer found $errorCount error(s) and $warningCount warning(s)"
          if ($errorCount -gt 0) {
            exit 1
          }
        } else {
          Write-Host "PSScriptAnalyzer found no issues"
        }

    - name: Run Pester tests
      shell: pwsh
      run: |
        $config = New-PesterConfiguration
        $config.Run.Path = 'tests'
        $config.TestResult.Enabled = $true
        $config.TestResult.OutputPath = './testResults.xml'
        $config.TestResult.OutputFormat = 'JUnitXml'
        $config.CodeCoverage.Enabled = $true
        $config.CodeCoverage.OutputPath = './coverage.xml'
        $config.CodeCoverage.OutputFormat = 'CoverageGutters'
        $config.Output.Verbosity = 'Detailed'
        
        $result = Invoke-Pester -Configuration $config
        
        Write-Host "Test Summary:"
        Write-Host "  Passed: $($result.PassedCount)"
        Write-Host "  Failed: $($result.FailedCount)" 
        Write-Host "  Skipped: $($result.SkippedCount)"
        Write-Host "  Total: $($result.TotalCount)"
        
        if ($result.FailedCount -gt 0) {
          Write-Host "::error::$($result.FailedCount) test(s) failed"
          exit 1
        }

    - name: Publish test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          ./testResults.xml
          ./coverage.xml

    - name: Publish test results summary
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Pester Tests
        path: ./testResults.xml
        reporter: java-junit
        fail-on-error: true

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    needs: test
    steps:
    - name: Checkout for Release
      uses: actions/checkout@v4
      
    - name: Publish to PowerShell Gallery
      if: success()
      shell: pwsh
      env:
        PSGalleryApiKey: ${{ secrets.PSGALLERY_API_KEY }}
      run: |
        .\Build.ps1 -Package -Analyze -patchVersion "${{ github.run_number }}${{ github.run_attempt }}" -NuGetApiKey $env:PSGalleryApiKey

    - name: Get Module Version
      if: success()
      id: get_version
      shell: pwsh
      run: |
        $manifestPath = "src/AzKube/AzKube.psd1"
        $moduleInfo = Import-PowerShellDataFile -Path $manifestPath
        $fullVersion = $moduleInfo.ModuleVersion
        echo "version=$fullVersion" >> $env:GITHUB_OUTPUT

    - name: Create GitHub Release
      if: success()
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $tagName = "v$version"
        $title = "Release v$version"
        
        # Create release with auto-generated notes
        gh release create $tagName `
          --generate-notes `
          --notes "Release of AzKube version $version`n`nThis release has been published to the PowerShell Gallery.`n" `
          --latest
